id: en
nome: "Mundo Antigo (EN)"
idioma: en-US
locale: en_US

voz:
  # Identificada nas entregas antigas com `mundoantigo voz identificar` (0,98 de
  # semelhanca nos dois videos EN): americano, velocidade normal.
  provedor: kokoro
  voice_id: "am_michael"
  velocidade: 1.0
  variante: "general-american"

narrativa:
  template: gancho-contexto-desenvolvimento-revelacao-fechamento
  tom: "serious documentary"
  # Ingles narrado corre um pouco mais rapido que o PT-BR.
  ppm: 160
  duracao_alvo_min: 18
  duracao_alvo_max: 22
  # O roteiro EN e adaptacao do PT-BR revisado, nao traducao (brief 3.3).
  origem: adaptacao_de_pt_br

unidades:
  sistema: imperial_com_metrico_entre_parenteses
  moeda_referencia: USD
  formato_data: "MM/DD/YYYY"

publicacao:
  divulgar_conteudo_sintetico: true
  categoria_youtube: "Education"
  # Textos fixos da descricao (publishing/description.py).
  textos:
    fontes: "Sources:"
    divulgacao: >-
      Research and script produced with AI assistance, under human direction,
      fact-checking and editorial review. Narration and illustrations generated
      by AI. Sources above.
    creditos_imagens: "Illustrations redrawn from reference photos:"
    creditos_musica: "Music:"
    autor_desconhecido: "unknown author"
    creditos_no_comentario: "Illustration credits in the pinned comment."
    dominio_publico: "Public domain"

tiktok:
  # Conta do TikTok do canal (ADR 0010): mesmo nome e @ do YouTube,
  # "How the Ancient World Worked" (@HowtheAncientWorldWorked).
  hashtag_fixa: "#ancientworld"
  textos:
    # Cartao dos ultimos segundos de cada corte (camada `fim`).
    fim: "Full video pinned on our profile"
    # Ultima linha da legenda de cada corte.
    legenda_fim: "Full video pinned on our profile."
