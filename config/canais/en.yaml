id: en
nome: "Mundo Antigo (EN)"
idioma: en-US
locale: en_US

voz:
  # Identificada nas entregas antigas com `mundoantigo voz identificar` (0,98 de
  # semelhanca nos dois videos EN): americano, velocidade normal.
  provedor: kokoro
  voice_id: "am_michael"
  velocidade: 1.0
  variante: "general-american"

narrativa:
  template: gancho-contexto-desenvolvimento-revelacao-fechamento
  tom: "serious documentary"
  # Medido no Gize (04/10/2026): o am_michael a 1,0 fala 137 palavras por
  # minuto, contando so a fala. Com 160, a adaptacao saiu 14% mais longa que o
  # PT (ADR 0011). Nos aquedutos (09/10), o roteiro inteiro de 20 min saiu a
  # 130, e o PT ganhou 12% de pausas. Com o PT a 150, o limite por bloco fica
  # em 0,87 das palavras.
  ppm: 130
  duracao_alvo_min: 18
  duracao_alvo_max: 22
  # O roteiro EN e adaptacao do PT-BR revisado, nao traducao (brief 3.3).
  origem: adaptacao_de_pt_br

unidades:
  sistema: imperial_com_metrico_entre_parenteses
  moeda_referencia: USD
  formato_data: "MM/DD/YYYY"

publicacao:
  divulgar_conteudo_sintetico: true
  categoria_youtube: "Education"
  # Textos fixos da descricao (publishing/description.py).
  textos:
    fontes: "Sources:"
    divulgacao: >-
      Research and script produced with AI assistance, under human direction,
      fact-checking and editorial review. Narration and illustrations generated
      by AI. Sources above.
    creditos_imagens: "Illustrations redrawn from reference photos:"
    creditos_musica: "Music:"
    autor_desconhecido: "unknown author"
    creditos_no_comentario: "Illustration credits in the pinned comment."
    dominio_publico: "Public domain"

tiktok:
  # Conta do TikTok do canal (ADR 0010): mesmo nome e @ do YouTube,
  # "How the Ancient World Worked" (@HowtheAncientWorldWorked).
  hashtag_fixa: "#ancientworld"
  # Conta parada em 08/10/2026, sem apagar (ADR 0010, revisao de 08/10): o
  # primeiro corte em ingles foi visto 96% no Brasil, porque o TikTok entrega
  # pela localizacao de quem posta. Com 0, a etapa nao escolhe nem renderiza
  # cortes EN, e a entrega nao tem `tiktok/en/`. Para voltar, ponha a
  # quantidade (o app.yaml tem a padrao, em `cortes.quantidade`) e tire o PT de
  # 6 para 3, para as contas nao repetirem trecho.
  cortes: 0
  # O video inteiro fica so na conta PT (06/10/2026): com as mesmas imagens nas
  # duas contas, o TikTok pode marcar uma como copia da outra. Os cortes EN sao
  # de trechos que a conta PT nao posta, e mandam para o YouTube, onde o video
  # tem a faixa em ingles (ADR 0011).
  video_inteiro: false
  textos:
    # Cartao dos ultimos segundos de cada corte (camada `fim`).
    fim: "Full documentary on YouTube"
    # Ultima linha da legenda de cada corte.
    legenda_fim: "Full documentary on YouTube, link in bio."
