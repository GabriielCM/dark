id: pt-br
nome: "Mundo Antigo (PT-BR)"
idioma: pt-BR
locale: pt_BR

voz:
  # Identificada nas entregas antigas com `mundoantigo voz identificar` (0,98 de
  # semelhanca nos dois videos). Trocar aqui, nao no codigo.
  provedor: kokoro
  voice_id: "pm_santa"
  velocidade: 0.9
  # Sotaque/variante — so faz sentido para o canal EN, aqui fica nulo.
  variante: null

narrativa:
  # Estrutura base do brief 3.3, com variacoes por pilar.
  template: gancho-contexto-desenvolvimento-revelacao-fechamento
  tom: "documental serio"
  # Palavras por minuto da narracao em PT-BR — usado para estimar duracao.
  ppm: 150
  duracao_alvo_min: 18
  duracao_alvo_max: 22

unidades:
  sistema: metrico
  moeda_referencia: BRL
  formato_data: "DD/MM/AAAA"

publicacao:
  # Vira o checklist do pacote de entrega.
  divulgar_conteudo_sintetico: true
  categoria_youtube: "Education"
  # Textos fixos da descricao (publishing/description.py), com acento.
  textos:
    fontes: "Fontes:"
    divulgacao: >-
      Pesquisa e roteiro produzidos com auxílio de IA, com direção, checagem de
      fatos e revisão editorial humanas. Narração e ilustrações geradas por IA.
      Fontes acima.
    creditos_imagens: "Ilustrações redesenhadas a partir de fotos de referência:"
    creditos_musica: "Música:"
    autor_desconhecido: "autor desconhecido"
    creditos_no_comentario: "Créditos das ilustrações no comentário fixado."
    dominio_publico: "Domínio público"

tiktok:
  # Conta do TikTok do canal (ADR 0010): mesmo nome e @ do YouTube, "Mundo Antigo".
  hashtag_fixa: "#mundoantigo"
  textos:
    # Cartao dos ultimos segundos de cada corte (camada `fim`).
    fim: "Vídeo completo fixado no perfil"
    # Ultima linha da legenda de cada corte.
    legenda_fim: "Vídeo completo fixado no perfil."
