# Configuracao geral do pipeline. Segredos ficam no .env, nunca aqui.

orcamento:
  # Tetos em USD. Ver ADR 0003. O .env sobrescreve estes valores.
  soft_limit_usd: 35.0
  hard_limit_usd: 50.0
  per_video_limit_usd: 5.0
  # strict = modelo sem preco em precos.yaml e bloqueado.
  modelo_desconhecido: strict

fila:
  max_attempts: 3
  lease_minutes: 30
  backoff_seconds: [30, 120, 480]
  # Quantos vídeos podem estar em execucao ao mesmo tempo.
  max_videos_concorrentes: 1
  # A GPU e uma so: etapas marcadas como gpu-bound serializam aqui.
  gpu_slots: 1

provedores:
  llm:
    padrao: openrouter
    openrouter:
      # Modelo barato para tarefas mecanicas (storyboard, tags). O OpenRouter
      # nao tem "gemini-3.1-flash" (conferido em 29/09); o mais proximo e o lite.
      # Se o storyboard sair fraco, o gemini-3.8-flash custa 3x e ainda e barato.
      modelo_rapido: "google/gemini-3.1-flash-lite"
      # Modelo bom para roteiro e checagem.
      modelo_principal: "anthropic/claude-sonnet-5"
      # Pede objeto JSON valido ao modelo (response_format); todo prompt do
      # projeto responde em JSON. Os dois modelos acima aceitam (29/09).
      modo_json: true
      # Esforco de raciocinio por modelo (`reasoning.effort`: none, minimal,
      # low, medium, high). O Sonnet 5 raciocina por padrao no OpenRouter: na
      # adaptacao EN de 04/10, 6.806 dos 8.540 tokens de saida eram raciocinio,
      # e o roteiro de 20 min estourou o limite duas vezes. O esforco vira uma
      # fracao do max_tokens (low ~20%). Modelo fora da lista fica no padrao.
      raciocinio:
        "anthropic/claude-sonnet-5": "low"
      timeout_s: 180
      max_retries: 2
  imagem:
    # local primeiro (CLAUDE.md). Z-Image Turbo no ComfyUI local (ADR 0005):
    # ~26 s por imagem em 1920x1088 na 3060 com os pesos int8.
    padrao: comfyui
    comfyui:
      modelo: "z-image-turbo"
      url: "http://127.0.0.1:8188"
      workflows:
        txt2img: "config/comfyui/zimage_txt2img.v1.json"
        img2img: "config/comfyui/zimage_img2img.v1.json"
      unet: "z_image_turbo_int8_convrot.safetensors"
      weight_dtype: "default"
      clip: "qwen_3_4b_fp8_mixed.safetensors"
      vae: "ae.safetensors"
      steps: 8
      cfg: 1.0
      sampler: "res_multistep"
      scheduler: "simple"
      shift: 3.0
      # Tamanho pedido pela etapa de cenarios. O Remotion cuida da folga do
      # zoom; ampliar antes nao acrescenta detalhe.
      largura: 1920
      altura: 1088
      # Maior tamanho gerado direto; pedidos maiores sao ampliados (Lanczos).
      max_largura: 1920
      max_altura: 1088
      # CFG 1 ignora o prompt negativo: as restricoes vao no positivo.
      suporta_negativo: false
      timeout_s: 600
    flux_local:
      modelo: "black-forest-labs/FLUX.1-schnell"
      steps: 4
      largura: 1536
      altura: 864
    openrouter:
      modelo: "google/nano-banana-2"
  tts:
    # Pendente do teste cego (brief 6.1). kokoro e local e custa zero.
    padrao: kokoro
    kokoro:
      modelo: "kokoro-v1"
    elevenlabs:
      modelo: "eleven_multilingual_v2"
    fish:
      modelo: "s2-pro"
  alinhamento:
    padrao: faster_whisper
    faster_whisper:
      modelo: "large-v3"
      compute_type: "float16"
      device: "cuda"
  referencias:
    # Fotos de referencia para img2img (ADR 0006). API publica, sem custo.
    padrao: commons
    commons:
      modelo: "commons-api"
      # Larguras aceitas pelo servidor: 250, 330, 500, 960, 1280, 1920, 3840.
      largura_download: 1920
      timeout_s: 60
  busca:
    padrao: brave
    brave:
      resultados_por_consulta: 8

fatos:
  # Um item de confianca baixa bloqueia (brief 3.4). Nao afrouxar sem aprovacao.
  bloqueia_em: ["baixa"]
  # Quantas vezes o pipeline tenta reescrever sozinho antes de escalar para humano.
  max_reescritas: 2
  # Minimo de fontes independentes para uma afirmacao contar como "alta".
  fontes_para_alta: 2

narracao:
  # Faixa unica de audio (ADR 0011): o video PT sobe com a narracao EN como
  # segunda faixa (Studio > Idiomas). Cada bloco fica com a duracao da maior
  # das duas narracoes, e o idioma mais curto ganha pausas. Em teste desde
  # 06/10/2026; com false, os dois videos voltam a ter cortes independentes.
  faixa_unica: true
  # Bloco EN acima do limite de palavras (PT x ppm EN / ppm PT) por mais que
  # isto e encurtado uma vez pelo modelo principal (aprovado em 06/10/2026).
  encurtar_bloco_acima: 0.08
  # Bloco esticado acima disto vira aviso na pagina. No teste aprovado, o PT
  # esticou 1,9%; com a adaptacao antiga, 11 a 21%.
  aviso_esticamento: 0.06

cenas:
  # Ritmo das imagens (ADR 0012, que revisa o 0008). Os videos antigos trocavam
  # a cada ~6 s (4 a 8); nos cortes do TikTok isso ficou lento, e o video
  # inteiro passou a ~3 s (aprovado em 09/10/2026). O corte usa a duracao real
  # da narracao e mira o alvo no PT e no EN; fora da faixa so quando nao ha
  # outro corte. Uma frase que passa do maximo do trecho pode trocar de imagem
  # no meio: na pontuacao, antes de conjuncao ou entre palavras, nessa ordem.
  segundos_por_cena_alvo: 3.0
  segundos_por_cena_min: 2.0
  segundos_por_cena_max: 4.5
  # O primeiro minuto, onde a retencao cai (~70% no concreto), ainda mais rapido.
  abertura:
    segundos: 60
    alvo: 2.5
    min: 1.8
    max: 3.5
  duracao_alvo_min_s: 1080  # 18 min
  duracao_alvo_max_s: 1320  # 22 min

render:
  fps: 30
  largura: 1920
  altura: 1080
  # Caminho do projeto Remotion, relativo a raiz.
  projeto: "render"
  # concurrency do Remotion. Medido em 29/09 no i5-12400F (6 nucleos), 1080p30:
  # 2 -> 27 quadros/s, 4 -> 39, 6 -> 45. A montagem nunca roda junto com os
  # cenarios (um worker, uma etapa por vez), entao nao disputa a GPU.
  concurrency: 6
  crf: 18
  # Fonte das camadas (titulo, tarja, rotulos, baloes), escolhida no quadro de
  # fontes em 29/09: a mais parecida com a dos videos entregues. Opcoes, todas
  # OFL e embutidas em render/src/fonts/: Comic Relief, Comic Neue, Baloo 2.
  fonte: "Comic Relief"

cortes:
  # Cortes verticais para o TikTok (ADR 0010), escolhidos pelo LLM barato entre
  # trechos medidos por codigo: frases inteiras, dentro de um bloco do roteiro.
  # Cortes por conta, quando o canal nao diz outra coisa em `tiktok.cortes`
  # (desde 08/10/2026: 6 no PT e 0 no EN, que esta parado).
  quantidade: 3
  # So video com mais de 1 minuto entra no Programa de Recompensas do TikTok.
  # O minimo PT e 65 s para o bloco de abertura (o gancho, ~68 s) caber; o EN
  # sai 10 a 20% mais longo que o PT.
  duracao_pt_s: [65, 100]
  duracao_en_s: [65, 115]
  # Dois inicios candidatos no mesmo bloco ficam pelo menos isto separados.
  espaco_entre_inicios_s: 15
  largura: 1080
  altura: 1920
  # Gancho no alto da tela nos primeiros segundos, e o cartao "video completo
  # fixado no perfil" nos ultimos.
  gancho_s: 3.0
  gancho_max_palavras: 8
  fim_s: 2.5
  # Minimo e maximo de hashtags por post, contando a fixa do canal.
  hashtags: [3, 5]

backup:
  # Copia diaria para um disco fisico separado (ADR 0009). O codigo vai para o
  # GitHub; aqui entra o que so existe nesta maquina. MA_BACKUP_DESTINO no
  # .env sobrescreve o destino; sem destino, o backup fica desligado.
  destino: "D:/backup/mundoantigo"
  # Origens alem de banco, videos, biblioteca, livros, data e .env. Caminho
  # relativo e relativo a raiz do repositorio.
  extras:
    - "entregas anteriores"
    - "C:/dev/modelos"

revisao_imagens:
  # Primeira revisao humana: a grade com todas as imagens no painel (fase C2).
  # Ligada desde 30/09: o worker para aqui, a sessao confere cada imagem contra
  # a narracao e aprova com `mundoantigo aprovar <id> --etapa revisao_imagens`.
  # false faz a etapa aprovar sozinha.
  ativo: true

roteiro:
  # De onde vem a pesquisa, o roteiro PT e o relatorio de fatos:
  #   sessao -> feitos no Claude Code e importados com
  #             `mundoantigo importar-roteiro` (~US$ 0,35 por video no total)
  #   api    -> OpenRouter, sem ninguem na sessao (~US$ 3 por video)
  # Em `sessao`, o gate de fatos nao reescreve sozinho: a correcao volta para a sessao.
  modo: sessao

esteira:
  # `mundoantigo esteira <id>` (e `nova`) sobem o que faltar como processos
  # destacados, que sobrevivem ao terminal e a sessao do Claude (fase C).
  comfyui:
    # auto: so quando o provedor de imagem e o comfyui local. nunca: desliga.
    ligar: auto
    # MA_COMFYUI_DIR sobrescreve (outra maquina, outro disco).
    diretorio: "C:/dev/ComfyUI"
    comando: ["python_embeded/python.exe", "-s", "ComfyUI/main.py", "--listen", "127.0.0.1", "--port", "8188", "--disable-auto-launch"]
    # Tempo maximo para o ComfyUI responder depois de subir.
    espera_s: 180

notificacoes:
  # Avisos para o revisor quando a producao precisa dele (fase C): etapa que
  # espera revisao, falha, orcamento, pergunta do Claude, pacote pronto.
  # windows (toast com som; precisa do extra `windows`) | log | nenhum.
  padrao: windows
  windows:
    # Som do toast (AudioSource do windows-toasts): Reminder, Default, IM...
    som: Reminder
    # Fica na tela ate ser fechado quando precisa do revisor.
    insistente: true

referencias:
  # Busca no Wikimedia Commons para cenas de lugar, peca e plano detalhe com
  # um alvo real (ADR 0006). Licencas: CC0, dominio publico e CC BY.
  candidatos: 10
  # Lado maior minimo da foto, em pixels.
  largura_min: 1024
  # Quantas candidatas aceitas sao comparadas com o alvo antes de escolher.
  comparar: 4
  # Lugar e plano detalhe: a foto inteira vira a planta da imagem, recortada
  # no centro para 16:9. Largura/altura fora desta faixa perde o assunto (a
  # panoramica de museu da amostra de 29/09 tinha 3,8).
  proporcao: [1.0, 2.4]
  # Lugar e plano detalhe: a candidata que o CLIP acha mais parecida com uma
  # destas descricoes do que com o alvo sai (a tuba na parede do museu virou
  # uma cena de torre palida). Peca nao passa por isso: e recortada antes.
  sondas_descarte:
    - "a museum display with a label card"
    - "an object hanging on a plain white wall"
    - "a sign or a page of text"
  # clip (CLIP local compara imagem e texto) ou titulo (palavras do titulo).
  ranking: clip
  # Quanto o img2img pode se afastar da foto, por tipo de cena. Calibrado em
  # 29/09 com fotos do pacote antigo (docs/estilo/calibracao-img2img-*.jpg):
  # - abaixo de 0.7 o cenario ainda parece foto pintada e traz ate texto da
  #   foto (o carimbo de um queijo);
  # - lugar e detalhe ficam em cartum limpo a 0.75, com a planta do lugar;
  # - peca e objeto fino, e a 0.7 o modelo ja troca a forma pela que conhece
  #   (gladio vira espada de guarda cruzada): fica mais perto da foto.
  denoise:
    lugar: 0.75
    peca: 0.64
    plano_detalhe: 0.75
    # Tipo sem valor proprio que ganha foto pela grade de revisao (link do
    # revisor numa cena atuada, na thumbnail): cartum limpo, como lugar.
    padrao: 0.75
  # Recorte do objeto da foto de peca. Licenca comercial obrigatoria: o padrao
  # do rembg (BRIA RMBG-2.0) e CC BY-NC. Lista em style/character.py.
  recorte_modelo: isnet-general-use
