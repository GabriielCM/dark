# Guia de estilo visual (brief 5.1).
#
# Aprovado em 29/09/2026 na calibracao contra o teste de 17/09: Z-Image com
# traco forte em forca reduzida, variante "b-sombreado" (folhas em
# data/calibracao/semente-11/, ferramenta `mundoantigo estilo calibrar`).

id: cartunesco-v1-sombreado
status: aprovado

restricoes:
  # Criterio obrigatorio do brief 5.1: precisa funcionar em vetor.
  vetorizavel: true
  # Originalidade visual (CLAUDE.md). Estes termos sao proibidos no prompt.
  termos_proibidos:
    - "in the style of"
    - "disney"
    - "pixar"
    - "ghibli"
    - "studio ghibli"
    - "marvel"
    - "simpsons"
    - "south park"
    - "artstation trending"
  # Violencia: batalhas sem sangue nem mortes explicitas (brief 3.3). Vao
  # como negativo para os modelos que usam negativo.
  negativos:
    - "blood"
    - "gore"
    - "corpse"
    - "dead body"
    - "wound"
    - "graphic violence"
    - "photorealistic"
    - "3d render"
    - "text"
    - "watermark"
    - "signature"
  # O Z-Image roda com CFG 1, que ignora o negativo (ADR 0005): as mesmas
  # restricoes vao escritas no prompt positivo.
  negativos_como_positivo: >-
    No text, no letters, no numbers, no signs, no watermark. Inanimate objects
    and animals have no human faces. No blood, no wounds. Ancient setting with
    no modern objects unless the scene says it is modern.

composicao:
  # O MC recortado cobre cerca de um terco do quadro, de um dos lados
  # (render/src/components/Host.tsx). Sem isto, o assunto podia cair embaixo
  # dele: na amostra de 29/09 ele ficou em cima do relogio de agua.
  com_mc: >-
    Main subject in the {livre} two thirds of the frame; the {mc} third is
    plain background with nothing important in it.

prompt_base: >-
  Cartoon illustration with thick black ink outlines, warm historical palette,
  soft cel shading and light texture, detailed but clean shapes, calm
  documentary tone

paleta:
  # Definida junto com a identidade dos canais (brief 12).
  areia: "#E8D5B0"
  terracota: "#C1613C"
  bronze: "#8C6A3F"
  lapis: "#2E4A6B"
  carvao: "#22201D"
  osso: "#F5EFE2"

camera:
  # Movimento 2.5D (brief 5.3): zoom, pan e parallax com camadas.
  zoom_min: 1.00
  zoom_max: 1.12
  pan_max_px: 90
  # Numero de camadas de profundidade extraidas por cenario.
  camadas_parallax: 3

personagem:
  # O MC: rosto, cabelo e barba fixos; o figurino muda com o tema de cada
  # video (vem do roteiro, campo `figurino`). Proporcao mantida como saiu na
  # calibracao, por decisao do usuario.
  id: mc
  descricao_fixa: >-
    a friendly Roman man in his thirties with short dark brown hair, thick dark
    eyebrows and a full dark brown beard
  figurino_padrao: "a plain cream linen tunic with a brown leather belt"
  # Conjunto de poses recortadas gerado por video (style/character.py).
  biblioteca: "biblioteca/personagem"
  poses_minimas:
    - apontando
    - joinha
    - pensativo
    - apresentando
    - maos_para_cima
    - explicando
