name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Orquestrador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra dev --extra books

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tipos
        run: uv run mypy

      # O conjunto padrao nao toca a rede, a GPU nem o Remotion: os provedores
      # falsos cobrem tudo. Por isso ele roda inteiro no CI (ADR 0001).
      - name: Testes
        run: uv run pytest -q

  remotion:
    name: Montagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Instalar dependencias
        working-directory: render
        run: npm ci

      - name: Tipos
        working-directory: render
        run: npm run typecheck

  contrato:
    name: Contrato Python-Remotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: uv sync --extra dev

      # A fronteira entre os dois processos nao tem checagem de tipos; esta e
      # a checagem. Ver ADR 0001.
      - name: Comparar os dois lados do contrato
        run: uv run pytest tests/test_render_contract.py -q
