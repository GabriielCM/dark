[project]
name = "mundoantigo"
version = "0.1.0"
description = "Pipeline de producao de videos narrados de historia antiga (PT-BR e EN)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Instalado so na maquina que roda os modelos locais (RTX 3060).
local-gpu = [
    "faster-whisper>=1.0",
    "rembg>=2.0",
    "pillow>=10.0",
]
books = [
    "pypdf>=5.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
mundoantigo = "mundoantigo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mundoantigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
#  `-m slow` roda os lentos; o padrao os pula para o ciclo ficar curto.
addopts = "-m 'not slow'"
markers = [
    "slow: render de verdade no Remotion; exige `npm ci` em render/ e leva minutos",
]
filterwarnings = ["error::DeprecationWarning:mundoantigo.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI usa Depends() como default

[tool.mypy]
python_version = "3.11"
packages = ["mundoantigo"]
mypy_path = "src"
strict = true
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Bibliotecas sem stubs. As de GPU e OCR so existem na maquina de producao.
module = [
    "yaml.*", "numpy.*", "faster_whisper.*", "rembg.*", "ebooklib.*", "pypdf.*", "bs4.*",
    "torch.*", "diffusers.*", "kokoro.*", "soundfile.*", "pytesseract.*", "pdf2image.*",
]
ignore_missing_imports = true
