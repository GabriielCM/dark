[project]
name = "mundoantigo"
version = "0.1.0"
description = "Pipeline de producao de videos narrados de historia antiga (PT-BR e EN)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    #  Thumbnails, previas da revisao e checagem de imagens rodam sempre.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Instalado so na maquina que roda os modelos locais (RTX 3060).
#  O torch fica em 2.11 porque o torchaudio (voz-id) parou nessa versao e os
#  dois precisam casar. As rodas CUDA vem do indice do PyTorch (tool.uv.sources).
local-gpu = [
    "torch==2.11.*",
    "torchvision==0.26.*",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    #  O misaki (G2P do Kokoro em ingles) baixa este modelo via pip na primeira
    #  execucao; no venv do uv nao ha pip, entao ele vem declarado aqui (a URL
    #  esta em tool.uv.sources).
    "en-core-web-sm>=3.8",
    "faster-whisper>=1.2",
    "open-clip-torch>=3.0",
    "rembg>=2.0",
]
# Ferramenta de identificacao de voz: embeddings de locutor (ECAPA).
voz-id = [
    "speechbrain>=1.0",
    "torchaudio==2.11.*",
]
# Notificacoes da esteira na barra de tarefas.
windows = [
    "windows-toasts>=1.3; sys_platform == 'win32'",
]
books = [
    "pypdf>=5.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
mundoantigo = "mundoantigo.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mundoantigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
#  `-m slow` roda os lentos; o padrao os pula para o ciclo ficar curto.
addopts = "-m 'not slow'"
markers = [
    "slow: render de verdade no Remotion; exige `npm ci` em render/ e leva minutos",
]
filterwarnings = ["error::DeprecationWarning:mundoantigo.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI usa Depends() como default

[tool.mypy]
python_version = "3.11"
packages = ["mundoantigo"]
mypy_path = "src"
strict = true
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Bibliotecas sem stubs. As de GPU e OCR so existem na maquina de producao.
module = [
    "yaml.*", "numpy.*", "faster_whisper.*", "rembg.*", "ebooklib.*", "pypdf.*", "bs4.*",
    "torch.*", "diffusers.*", "kokoro.*", "soundfile.*", "pytesseract.*", "pdf2image.*",
    "open_clip.*", "speechbrain.*", "torchaudio.*", "windows_toasts.*", "misaki.*",
]
ignore_missing_imports = true
